<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create account | Lost & Found+</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">+</span>Lost & Found<span class="brand-plus">+</span></a><a href="login.html" class="text-link">Log in →</a></div></header>
<main class="auth-main"><div class="auth-card"><div class="auth-icon">+</div><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p class="muted">Join your community and help reunite belongings.</p><form id="registerForm"><label>Full name<input id="registerName" required placeholder="Your name"></label><label>Email<input id="registerEmail" type="email" required placeholder="you@example.com"></label><label>Password<input id="registerPassword" type="password" minlength="6" required placeholder="At least 6 characters"></label><div id="registerError" class="form-message error"></div><button class="btn btn-primary full">Create account →</button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></div></main><script src="auth.js"></script></body></html>
