<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Report item | Lost & Found+</title><link rel="stylesheet" href="style.css"></head>
<body class="app-page"><header class="site-header"><div class="container nav"><a class="brand" href="dashboard.html"><span class="brand-mark">+</span>Lost & Found<span class="brand-plus">+</span></a><nav><a href="items.html">Browse</a><a href="my-reports.html">My reports</a><a href="dashboard.html">Dashboard</a></nav></div></header>
<main class="container form-main"><div class="form-heading"><a href="dashboard.html" class="back-link">← Dashboard</a><span class="eyebrow" id="reportEyebrow">REPORT AN ITEM</span><h1 id="reportTitle">Report a lost item</h1><p class="muted">Give enough detail to help someone recognize it.</p></div>
<form id="reportForm" class="report-layout"><div class="form-panel"><div class="panel-title"><span>01</span><h2>Item information</h2></div><div class="two-col"><label>Item name<input id="itemName" required placeholder="e.g. Black leather wallet"></label><label>Date <input id="itemDate" type="date" required></label></div><label>Place <input id="itemPlace" required placeholder="e.g. Central Library"></label><label>Description<textarea id="itemDescription" required rows="5" placeholder="Describe the item, color, identifying marks, or anything useful..."></textarea></label><label>Contact email<input id="itemContact" type="email" required placeholder="you@example.com"></label></div>
<div class="form-panel"><div class="panel-title"><span>02</span><h2>Item photo</h2></div><label class="upload-box" for="itemImage"><div id="imagePreview" class="upload-preview"><span class="upload-icon">↑</span><strong>Choose an image</strong><small>Images or other files · Max 10MB</small></div><input id="itemImage" type="file" accept="*/*"></label><div id="reportMessage" class="form-message"></div><button class="btn btn-primary full" type="submit">Publish report →</button><p class="form-note">Your report is stored locally in this MVP.</p></div></form></main><script src="items.js"></script></body></html>
