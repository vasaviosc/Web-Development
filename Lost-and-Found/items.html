<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Browse reports | Lost & Found+</title><link rel="stylesheet" href="style.css"></head>
<body class="app-page"><header class="site-header"><div class="container nav"><a class="brand" href="dashboard.html"><span class="brand-mark">+</span>Lost & Found<span class="brand-plus">+</span></a><nav><a class="active" href="items.html">Browse</a><a href="my-reports.html">My reports</a><a href="dashboard.html">Dashboard</a></nav></div></header>
<main class="container app-main"><div class="page-heading"><div><span class="eyebrow">COMMUNITY REPORTS</span><h1>Find an item</h1><p class="muted">Search through lost and found reports.</p></div><a href="report.html?type=lost" class="btn btn-primary">+ Report item</a></div>
<div class="search-panel"><div class="search-input"><span>⌕</span><input id="searchInput" aria-label="Search reports" placeholder="Search by item, description or place..."></div><select id="typeFilter" aria-label="Filter by report type"><option value="all">All reports</option><option value="lost">Lost items</option><option value="found">Found items</option></select><select id="statusFilter" aria-label="Filter by report status"><option value="all">All statuses</option><option value="active">Active reports</option><option value="recovered">Recovered reports</option></select><label class="date-filter">From<input id="dateFromFilter" type="date" aria-label="Filter reports from date"></label><label class="date-filter">To<input id="dateToFilter" type="date" aria-label="Filter reports to date"></label><select id="sortBy" aria-label="Sort reports"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="name-asc">Item name (A–Z)</option><option value="name-desc">Item name (Z–A)</option></select><button id="clearFilters" class="btn btn-secondary">Clear</button></div>
<div id="itemsCount" class="results-count" role="status" aria-live="polite"></div><div id="itemsGrid" class="item-grid"></div></main><script src="items.js"></script></body></html>
